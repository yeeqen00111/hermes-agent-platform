server:
  port: 8081

spring:
  application:
    name: hermes-runtime
  datasource:
    # 开发环境使用SQLite，生产环境通过环境变量切换到MySQL（compose 见仓库根 docker-compose.yml）
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./data/hermes_agent.db}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.sqlite.JDBC}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# HERMES Agent Platform Configuration
hermes:
  agent:
    # 默认模型配置
    default-model: ${DEFAULT_MODEL:gpt-4}
    # 工具执行超时时间(ms)
    tool-timeout: 10000
    # SSE心跳间隔(ms)
    sse-heartbeat-interval: 15000
    # 审批超时时间(s)
    approval-timeout: 300
  security:
    # 服务间调用令牌
    service-token: ${SERVICE_TOKEN:change-me-in-production}
  tools:
    # 迁移项工具 mock 开关（仅开发联调；false 时未接通工具显式报 MIGRATION_PENDING，不返回假数据）
    mock: false
  migration:
    data-plane:
      # Java 平台数据面地址（四期迁移对接位，契约见 migration-assessment.md §6，待 Java 团队确认）
      base-url: ${MIGRATION_DATA_PLANE_BASE_URL:}
  channel:
    # 入站事件令牌（契约 §6.2 方向A；未配置时开发放行并告警）
    inbound-token: ${HERMES_CHANNEL_INBOUND_TOKEN:}
    # 渠道适配器配置
    feishu:
      enabled: false
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      # 出站 API 基址（冒烟测试可指向本地 mock）
      base-url: ${HERMES_FEISHU_BASE_URL:https://open.feishu.cn}
  sso:
    # PDDS 对接位令牌（契约 §6.2 方向A；未配置时开发放行并告警）
    token: ${HERMES_SSO_TOKEN:}

logging:
  level:
    com.hermes.agent: DEBUG
    org.springframework.web: INFO
